[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "llmfy-guardrails"
dynamic = ["version"]
description = "Standalone PII detection and masking guardrails for text pipelines (PIIGuard)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "irufano", email = "irufano.official@gmail.com" },
]
keywords = [
    "llm",
    "ai",
    "guardrails",
    "pii",
    "privacy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/llmfy-labs/llmfy-guardrails-python"
Repository = "https://github.com/llmfy-labs/llmfy-guardrails-python"
Issues = "https://github.com/llmfy-labs/llmfy-guardrails-python/issues"

[project.optional-dependencies]
spacy = ["spacy>=3.8.14"]
all = [
    "spacy",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.1.0",
    "spacy>=3.8.0",
    "xx-ent-pii-sm",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"

[tool.hatch.build.hooks.vcs]
version-file = "llmfy_guardrails/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["llmfy_guardrails"]

[tool.hatch.build.targets.sdist]
include = [
    "llmfy_guardrails/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv.sources]
xx-ent-pii-sm = { url = "https://github.com/irufano/spacy_ner_pii/releases/download/v0.1.0/xx_ent_pii_sm-0.1.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py311"
exclude = ["llmfy_guardrails/_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["llmfy_guardrails"]
